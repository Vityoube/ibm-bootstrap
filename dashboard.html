<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>FINLOGGER</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
    <link href="style.css" rel="stylesheet" />
    <meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>
    <header class="container-lg">
        <h1>FinLogger</h1>
        <p>Your financial diary!</p>
    </header>
    <main>
        <section class="container-lg">
            <div class="row overview-row">
                <div class="col-md-6">
                    <h2>Overview</h2>
                </div>
                <div class="col-md-6" id="filter">
                    <div class="row g-3 justify-content-end align-items-center">
                        <div class="col-auto">
                            <input type="month" value="2020-01" class="form-control" id="monthFilter" onchange="handleMonthFilter();"/>
                        </div>
                        <div class="col-auto">
                            <button type="button" class="btn btn-primary expButton" data-mode="add">
                                Add Expense
                            </button>
                        </div>
                    </div>
                </div>
            </div>
            <div class="row overview-row">
                <div class="col-md-4">
                    <div class="card">
                        <div class="card-body">
                            <div class="d-flex align-items-center">
                                <div class="me-3">
                                    <!-- Icon -->
                                    <img src="./images/spending.png" alt="Expenses" class="icon"/>
                                </div>
                                <div>
                                    <!-- Text -->
                                    <p class="card-text">Expenses</p>
                                    <h5 class="card-title" id="totalExpenses"></h5>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="card">
                        <div class="card-body">
                            <div class="d-flex align-items-center">
                                <div class="me-3">
                                    <!-- Icon -->
                                    <img src="./images/income.png" alt="Monthly Income" class="icon"/>
                                </div>
                                <div>
                                    <!-- Text -->
                                    <p class="card-text">Monthly Income</p>
                                    <h5 class="card-title" id="monthlyIncome" ></h5>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="card">
                        <div class="card-body">
                            <div class="d-flex align-items-center">
                                <div class="me-3">
                                    <!-- Icon -->
                                    <img src="./images/balance.png" alt="Balance" class="icon"/>
                                </div>
                                <div>
                                    <!-- Text -->
                                    <p class="card-text">Balance</p>
                                    <h5 class="card-title" id="balance"></h5>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="row">
                <div class="col-md-4">
                    <h5>Expense Summary</h5>
                    <table id="expense-summary" class="table border">
                        <thead>
                        <tr>
                            <th>EXPENSE CATEGORY</th>
                            <th>%</th>
                        </tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </div>
                <div class="col-md-8">
                    <h5>Expense Details</h5>
                    <table id="expense-details" class="table border">
                        <thead>
                        <tr class="d-table-row">
                            <th>DATE</th>
                            <th>DESCRIPTION</th>
                            <th>AMOUNT</th>
                            <th></th>
                        </tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </div>
            </div>
        </section>
    </main>
    <script src="data.js"></script>
    <script src="script.js"></script>
</body>
</html>
